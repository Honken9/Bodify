services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # Ingen publicerad port som standard — trafiken kommer via Cloudflare
    # Tunnel. Avkommentera för att nå appen direkt på LAN:
    # ports:
    #   - "8080:80"
    depends_on:
      - web
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    profiles: ["tunnel"]
    depends_on:
      - caddy

  web:
    build: apps/web
    restart: unless-stopped

  api:
    build: apps/api
    restart: unless-stopped
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://bodify:${DB_PASSWORD:-bodify}@db:5432/bodify
      REDIS_URL: redis://redis:6379/0
      CF_TEAM_DOMAIN: ${CF_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_ACCESS_APP_ID: ${CF_ACCESS_APP_ID:-}
      CF_ACCESS_POLICY_ID: ${CF_ACCESS_POLICY_ID:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      AUTO_PROVISION_USERS: ${AUTO_PROVISION_USERS:-false}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DATA_DIR: /srv/data
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_VERIFY_TOKEN: ${STRAVA_VERIFY_TOKEN:-bodify-strava}
      WITHINGS_CLIENT_ID: ${WITHINGS_CLIENT_ID:-}
      WITHINGS_CLIENT_SECRET: ${WITHINGS_CLIENT_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-se.vintermist.Shapiqo}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.1}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl}
    volumes:
      - appdata:/srv/data
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: apps/api
    restart: unless-stopped
    command: arq app.workers.main.WorkerSettings
    environment: *api-env
    volumes:
      - appdata:/srv/data
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bodify
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bodify}
      POSTGRES_DB: bodify
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodify -d bodify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ollama:/root/.ollama
    # Avkommentera vid NVIDIA-GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  dbdata:
  redisdata:
  appdata:
  ollama:
